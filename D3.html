      <stop offset="100%" stop-color="#0F172A"/>

  </g>

  <g transform="translate(30, 355)">
    <rect width="480" height="80" rx="16" fill="#8B5CF6" transform="rotate(-1)"/>
    <text x="240" y="52" font-size="26" font-weight="900" fill="#FFF" text-anchor="middle" transform="rotate(-1)">f&uuml;r den GANZEN TAG! ⚡</text>

    <text x="150" y="70" font-size="50" font-weight="900" fill="#FACC15" text-anchor="middle">100%</text>
    <text x="150" y="110" font-size="18" font-weight="800" fill="#FFF" text-anchor="middle">NATÜRLICHER FOKUS</text>
    <text x="150" y="145" font-size="14" font-weight="500" fill="#A7F3D0" text-anchor="middle">✓ Ohne Kaffee-Crashes</text>
    <text x="150" y="170" font-size="14" font-weight="500" fill="#A7F3D0" text-anchor="middle">✓ Zuckerfrei &amp; Vegan</text>
  </g>

  <!-- Big Converting CTA -->
  <g transform="translate(30, 810)">
    <rect width="480" height="80" rx="40" fill="url(#yellowGlow)"/>
    <text x="240" y="48" font-size="22" font-weight="900" fill="#000" text-anchor="middle" letter-spacing="1">JETZT PROBIEREN (TESTPACKAGE) ➔</text>
  </g>
</svg>
