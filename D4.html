<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" style="width:100%; max-width:650px; height:auto; font-family: 'Helvetica Neue', Arial, sans-serif; border-radius: 20px; background: #08070B; box-shadow: 0 30px 60px rgba(0,0,0,0.8);">
  <defs>
    <!-- Dark Studio Glow -->
    <radialGradient id="spotlight" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1F1338"/>
      <stop offset="60%" stop-color="#08070B"/>
    </radialGradient>

    <!-- Metallic Gold Foil -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>

    <!-- Floor Reflection Blur -->
    <filter id="floorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="1000" height="650" fill="url(#spotlight)"/>

  <!-- Floor Glow -->
  <ellipse cx="500" cy="560" rx="300" ry="40" fill="#7000FF" opacity="0.25" filter="url(#floorShadow)"/>
  <ellipse cx="500" cy="560" rx="180" ry="20" fill="#CCFF00" opacity="0.2" filter="url(#floorShadow)"/>

  <!-- Top Clean Tag -->
  <text x="60" y="60" font-size="12" font-weight="800" fill="#CCFF00" letter-spacing="3">SPIEGEL BESTSELLER 2026</text>
  <text x="940" y="60" font-size="12" font-weight="700" fill="#8888A0" text-anchor="end" letter-spacing="2">HARDCOVER EDITION</text>

  <!-- ================= MAIN CENTER 3D HARDCOVER BOOK ================= -->
  <g transform="translate(390, 130)">
    
    <!-- Real Book Pages Stack Effect (Right Edge) -->
    <path d="M 210,12 L 230,22 L 230,362 L 210,352 Z" fill="#E2DDD5"/>
    <path d="M 12,352 L 210,352 L 230,362 L 12,362 Z" fill="#C5C0B6"/>

    <!-- Spine 3D Angle -->
    <path d="M 0,0 L 12,12 L 12,352 L 0,340 Z" fill="#040207"/>
    <path d="M 10,10 L 12,12 L 12,352 L 10,350 Z" fill="url(#goldGradient)" opacity="0.8"/>

    <!-- Front Cover Surface -->
    <rect x="12" y="12" width="198" height="340" rx="3" fill="#0D0915" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Book Cover Artwork (Clean Grid) -->
    <rect x="25" y="25" width="172" height="314" rx="2" fill="none" stroke="rgba(255,255,255,0.05)"/>
    
    <text x="111" y="90" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MINDSET</text>
    <text x="111" y="128" font-size="34" font-weight="900" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="1">2026</text>

    <line x1="50" y1="150" x2="172" y2="150" stroke="#7000FF" stroke-width="2"/>

    <!-- Minimal Icon -->
    <circle cx="111" cy="205" r="24" fill="none" stroke="url(#goldGradient)" stroke-width="2"/>
    <polygon points="107,193 119,205 107,217" fill="#CCFF00"/>

    <text x="111" y="270" font-size="9" font-weight="700" fill="#8888A0" text-anchor="middle" letter-spacing="2">ERFOLG IM KI-ZEITALTER</text>
    <text x="111" y="310" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MARCUS VOGEL</text>
  </g>

  <!-- ================= LEFT SIDE: SPINE CARD ================= -->
  <g transform="translate(80, 200)">
    <rect width="210" height="260" rx="16" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.08)"/>
    
    <!-- Clean Spine Mockup -->
    <rect x="90" y="35" width="30" height="150" rx="3" fill="#0D0915" stroke="url(#goldGradient)" stroke-width="1.5"/>
    <text x="105" y="85" font-size="10" font-weight="900" fill="#FFF" text-anchor="middle" transform="rotate(-90 105 85)" letter-spacing="2">MINDSET 2026</text>

    <text x="105" y="215" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">BUCHRÜCKEN</text>
    <text x="105" y="235" font-size="11" font-weight="500" fill="#CCFF00" text-anchor="middle">380 Seiten Hardcover</text>
  </g>

  <!-- ================= RIGHT SIDE: INSIDE PAGES CARD ================= -->
  <g transform="translate(710, 200)">
    <rect width="210" height="260" rx="16" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.08)"/>
    
    <!-- Open Book Vector -->
    <g transform="translate(50, 60)">
      <rect x="0" y="0" width="52" height="75" fill="#FAF9F6" rx="2"/>
      <rect x="54" y="0" width="52" height="75" fill="#EFECE6" rx="2"/>
      <line x1="8" y1="15" x2="42" y2="15" stroke="#111" stroke-width="2"/>
      <line x1="8" y1="28" x2="44" y2="28" stroke="#AAA" stroke-width="1"/>
      <line x1="8" y1="38" x2="38" y2="38" stroke="#AAA" stroke-width="1"/>
      <line x1="62" y1="15" x2="96" y2="15" stroke="#7000FF" stroke-width="2"/>
      <line x1="62" y1="28" x2="98" y2="28" stroke="#AAA" stroke-width="1"/>
    </g>

    <text x="105" y="215" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">LAYOUT &amp; DESIGN</text>
    <text x="105" y="235" font-size="11" font-weight="500" fill="#CCFF00" text-anchor="middle">Inkl. KI-Workbooks</text>
  </g>

  <!-- Footer Clean Highlights -->
  <line x1="60" y1="570" x2="940" y2="570" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="150" y="605" font-size="12" font-weight="700" fill="#FFF">★ 4.96/5 RATING</text>
  <text x="500" y="605" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">⚡ INKLUSIVE AUDIOBOOK &amp; E-BOOK</text>
  <text x="850" y="605" font-size="12" font-weight="700" fill="#FFF" text-anchor="end">🚚 KOSTENLOSER VERSAND</text>
</svg>
